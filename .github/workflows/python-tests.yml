name: CI & Release Build

on:
  push:
    branches: [ "main", "dev" ]
    tags:
      - 'v*' # Trigger build on version tags
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-xfixes0 libopengl0 libegl1
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest
      - name: Run Tests with Xvfb
        env:
          DISPLAY: :99.0
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          pytest

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        # FIXED: Added 'Pillow' so PyInstaller can convert PNG icons to ICO
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller Pillow
      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
          --add-data "assets;assets" `
          --icon "assets/PandaLedger_256.png" `
          --name "PandaLedger" `
          src/main.py
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/PandaLedger.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
