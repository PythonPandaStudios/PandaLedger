[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandaledger"
version = "0.1.0"
description = "A Python-based payroll and ledger application for tracking income, expenses, and taxes."
authors = [
    { name = "Python Panda Studios", email = "dev@pythonpandastudios.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pythonpandastudios/pandaledger"
Repository = "https://github.com/pythonpandastudios/pandaledger.git"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]